# Put the browser demo in front of visitors.
#
# The demo under web/ is a static-assets-only Worker: public/ is committed, including
# the wasm module (web/wasm/build.sh writes it; there is no build here). A push to main
# that touches web/ deploys it; nothing else does — the plugin's release.yml knows
# nothing about the demo, and gen-downloads does not either.
#
# Deliberately the same shape as the fleet's other deploy workflows (negative-space is
# the house pattern), so the two read alike and a fix to one is obvious in the other.

name: deploy

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Newest push wins. Cancelling an in-flight build is safe: wrangler uploads the assets
# first and activates the version as one step at the end, so a run killed part way
# through never becomes the live version.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Fail in a second rather than after a build. A deploy that cannot authenticate
      # is the whole point of this job failing to happen.
      - name: Check the Cloudflare token is present
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set on this repository, so the"
            echo "::error::demo cannot be deployed. The account-scoped token cf-run reads"
            echo "::error::from the login keychain (service 'stoatworks-cloudflare') is"
            echo "::error::the one to set:"
            echo "::error::  gh secret set CLOUDFLARE_API_TOKEN --repo stoatworks-labs/proximate"
            exit 1
          fi
          echo "token present - ok"

      # The harness is what makes an automatic deploy defensible: it pins the committed
      # wasm module against a native clang++ build of the plugin's own DSP over the same
      # stimulus, so a module that drifted from the sources — or was never rebuilt after
      # them — cannot go live.
      - name: Verify the wasm module against the native build
        run: node test/harness.mjs

      # wrangler is pinned rather than left to resolve to latest: an unpinned npx would
      # let a wrangler major change how deploys behave on a morning nobody touched this
      # repo. Bump it deliberately.
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.116.0 deploy

      # Prove it actually landed, against the domain a visitor uses. The <head> is
      # untouched by Cloudflare's injected bot-management script (which lands before
      # </body> with a per-request nonce), so hashing it is stable across requests and
      # still catches a changed page.
      - name: Check the live site is serving this build
        run: |
          set -euo pipefail
          want=$(sed -n '1,/<\/head>/p' public/index.html | shasum -a 256 | cut -d' ' -f1)
          echo "expecting the live <head> to hash to $want"
          for attempt in 1 2 3 4 5; do
            got=$(curl -sS --max-time 30 "https://proximate-demo.stoatworks-labs.com/" \
                  | sed -n '1,/<\/head>/p' | shasum -a 256 | cut -d' ' -f1 || true)
            if [ "$got" = "$want" ]; then
              echo "live site is serving this build (attempt $attempt)"
              exit 0
            fi
            echo "not there yet, got $got — retrying in 10s (attempt $attempt)"
            sleep 10
          done
          echo "::error::Deployed, but https://proximate-demo.stoatworks-labs.com/ is"
          echo "::error::still not serving this build's <head>. The upload succeeded, so"
          echo "::error::this is the edge serving something else — check the Worker's"
          echo "::error::routes, and that proximate-demo is what the custom domain"
          echo "::error::actually points at."
          exit 1
